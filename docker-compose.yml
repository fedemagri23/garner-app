services:
  postgres:
    image: postgres:16-alpine
    container_name: garner_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # Over TCP on purpose: during first-boot init the server only listens on
    # its socket, so this stays unhealthy until init.sql has run.
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  redis:
    image: redis:7-alpine
    container_name: garner_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

volumes:
  postgres_data:
