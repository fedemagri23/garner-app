services:
  postgres:
    image: postgres:16-alpine
    container_name: garner_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # Over TCP on purpose: during first-boot init the server only listens on
    # its socket, so this stays unhealthy until init.sql has run.
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  redis:
    image: redis:7-alpine
    container_name: garner_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  # An S3-compatible API for the evidence store's object-storage adapter, so
  # it can be exercised locally and in CI without a cloud account.
  s3:
    image: adobe/s3mock:3.12.0
    container_name: garner_s3
    environment:
      initialBuckets: garner-evidence,garner-evidence-test
    ports:
      - '9090:9090'
    restart: always

volumes:
  postgres_data:
